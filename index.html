<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#1f4b8e">
<title>트립노트 — Trip notes</title>
<style>
/* ─── Design tokens ─────────────────────────────── */
:root {
  --bg:          #f3efe7;
  --paper:       #faf7f1;
  --ink:         #1b1d22;
  --ink-soft:    #595a60;
  --ink-faint:   #8a8b90;
  --rule:        #d9d2c3;
  --rule-soft:   #e8e2d4;
  --accent:      #1f4b8e;
  --accent-soft: #e5ecf7;
  --marker:      #c0392b;
  --warm:        #e0a74e;
  --sage:        #6b8e5a;
  --danger:      #c0392b;
  --success:     #6b8e5a;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 15px 30px -15px rgba(0,0,0,0.25);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141518; --paper: #1c1d21; --ink: #ebe7dd; --ink-soft: #a3a39d;
    --ink-faint: #6a6b6f; --rule: #2e2f33; --rule-soft: #26272b;
    --accent: #88b1ff; --accent-soft: #1e2a44; --marker: #e86a5d;
    --warm: #e0b36a; --sage: #8aad7a; --danger: #e86a5d; --success: #8aad7a;
    color-scheme: dark;
  }
}

@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Sans+KR:wght@400;500;700&display=swap');

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
input, button, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }

/* ─── Layout ──────────────────────────────────── */
#app {
  display: grid;
  grid-template-columns: 280px minmax(320px, 1fr) var(--aside-w, 400px);
  height: 100vh;
  height: 100dvh;
}
#scrim { display: none; }
@media (max-width: 1024px) {
  /* 모바일: 상단 = ☰ + 현재 여행 제목, 하단 = 일정. 여행 목록은 ☰ 서랍 */
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }
  #sidebar:not(.open), #aside { display: none !important; }
  #sidebar.open { display: flex; position: fixed; top: 0; left: 0; width: 85%; max-width: 320px; height: 100%; z-index: 50; box-shadow: var(--shadow-lg); padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  #scrim.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; }
  #trip-header-desktop { display: none; }
  #btn-add-place-header { display: none !important; }
}

/* ─── Sidebar: 여행 목록 ─────────────────────────── */
#sidebar {
  background: var(--paper);
  border-right: 1px solid var(--rule);
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.brand {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand::before {
  content: '';
  width: 10px; height: 10px;
  background: var(--marker);
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
}
.brand-sub {
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: -4px;
  margin-bottom: 10px;
}
.section-head {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
}
.icon-btn {
  width: 24px; height: 24px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
  font-size: 14px;
  line-height: 1;
  padding: 0;
}
.icon-btn:hover { background: var(--rule-soft); color: var(--ink); }

.trip-item {
  padding: 10px 12px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.15s;
  position: relative;
}
.trip-item:hover { background: var(--rule-soft); }
.trip-item.active { background: var(--accent-soft); border-color: var(--accent); }
.trip-item .t-title {
  font-weight: 500;
  font-size: 14px;
  padding-right: 28px;
}
.trip-item.active .t-title { color: var(--accent); }
.trip-item .t-date {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
  padding-right: 28px;
}
.trip-item-del {
  position: absolute;
  top: 50%;
  right: 6px;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border-radius: 4px;
  background: transparent;
  border: none;
  color: var(--ink-faint);
  font-size: 15px;
  line-height: 1;
  opacity: 0.7;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.trip-item-del:hover {
  background: color-mix(in srgb, var(--danger) 15%, transparent);
  color: var(--danger);
  opacity: 1;
}

/* ─── Main: Day 탭 + 장소 리스트 ─────────────────── */
#main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
.main-header {
  padding: 14px 20px 8px;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  flex-shrink: 0;
}
.mobile-bar {
  display: none;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
@media (max-width: 1024px) {
  .mobile-bar { display: flex; }
  .main-header { padding: 10px 14px 6px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
}
.menu-btn {
  width: 32px; height: 32px;
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
}
.trip-header-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
}
.trip-title {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 22px;
  margin: 0;
  cursor: pointer;
}
@media (max-width: 1024px) { .trip-title { font-size: 18px; } }
.trip-dates {
  color: var(--ink-soft);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.trip-meta {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--ink-faint);
  margin-top: 4px;
}
.export-btns { margin-left: auto; display: inline-flex; gap: 6px; }
.export-btn { font-size: 11px; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink-soft); }
.export-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.trip-meta .cost-sum {
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.day-tabs {
  display: flex;
  gap: 2px;
  margin-top: 10px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.day-tabs::-webkit-scrollbar { height: 4px; }
.day-tab {
  padding: 8px 14px;
  font-size: 12px;
  color: var(--ink-soft);
  border: none;
  background: transparent;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  flex-shrink: 0;
}
.day-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 500;
}
.day-tab .d-num {
  font-family: 'Fraunces', serif;
  font-style: italic;
  margin-right: 4px;
}
.day-tab.all-days {
  color: var(--ink-faint);
}
.day-tab.all-days.active {
  color: var(--sage);
  border-bottom-color: var(--sage);
}

/* 모바일: 지도 + 리스트 */
#middle-content {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}
@media (max-width: 1024px) {
  #middle-content { flex: 1; }
  #map-mobile-wrap { flex: 0 0 var(--map-h, 42%); min-height: 120px; position: relative; }
  #places-list { flex: 1 1 auto; overflow-y: auto; padding: 10px 14px 90px; min-height: 160px; }
}
@media (min-width: 1025px) {
  #map-mobile-wrap { display: none; }
  #places-list { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
}

/* 타임라인 */
.timeline {
  position: relative;
  padding-left: 28px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 10px; top: 8px; bottom: 8px;
  width: 1px;
  background: var(--rule);
}
.place {
  position: relative;
  margin-bottom: 6px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
  transition: box-shadow 0.15s;
}
.place:hover { box-shadow: var(--shadow-sm); }
.place.now { border-color: var(--warm); background: color-mix(in srgb, var(--warm) 10%, var(--paper)); }
.place .p-num {
  position: absolute;
  left: -28px; top: 8px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  font-variant-numeric: tabular-nums;
}
.place.now .p-num { background: var(--warm); }
.place .p-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.place .p-name {
  font-weight: 500;
  font-size: 14px;
  line-height: 1.3;
  min-width: 0;
  word-break: break-word;
}
.place .p-name .now-badge {
  font-size: 10px;
  color: var(--warm);
  background: color-mix(in srgb, var(--warm) 20%, transparent);
  padding: 1px 6px;
  border-radius: 10px;
  margin-left: 6px;
  font-weight: 600;
}
.place .p-grip {
  width: 24px; height: 28px; margin: -4px 0; display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-faint); font-size: 18px; line-height: 1; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.place .p-grip:active { cursor: grabbing; }
/* ─── 준비(체크리스트) ─────────────────────────── */
.day-tab.check-tab { margin-left: auto; color: var(--sage); }
.day-tab.check-tab.active { color: var(--sage); border-bottom-color: var(--sage); font-weight: 500; }
body.view-check .fab, body.view-check #btn-add-place-header { display: none !important; }
@media (max-width: 1024px) { body.view-check #map-mobile-wrap { display: none; } }
#check-root { padding-bottom: 60px; }
.check-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.check-progress { flex: 1; min-width: 160px; }
.check-bar { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.check-bar-fill { height: 100%; width: 0; background: var(--sage); transition: width .25s; }
.check-count { font-size: 12px; color: var(--ink-soft); margin-top: 4px; font-variant-numeric: tabular-nums; }
.check-filter { font-size: 12px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.check-add { display: flex; gap: 6px; margin-bottom: 14px; }
.check-add #check-cat-input { width: 84px; flex-shrink: 0; }
.check-add #check-text-input { flex: 1; min-width: 0; }
.check-add .btn { flex-shrink: 0; }
.c-group { margin-bottom: 12px; }
.c-group-head {
  display: flex; align-items: center; gap: 6px; padding: 6px 2px; cursor: pointer;
  font-size: 12px; letter-spacing: .06em; color: var(--ink-soft); border-bottom: 1px solid var(--rule); margin-bottom: 6px;
  user-select: none; -webkit-user-select: none;
}
.c-group-head .c-cat { font-weight: 600; color: var(--ink); }
.c-group-head .c-cat-count { margin-left: auto; font-variant-numeric: tabular-nums; }
.c-group-head.drop-target { background: var(--accent-soft); }
.c-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 4px; cursor: pointer;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; min-height: 44px;
}
.c-item:hover { box-shadow: var(--shadow-sm); }
.c-box {
  width: 22px; height: 22px; flex-shrink: 0; border: 2px solid var(--ink-faint); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; line-height: 1; transition: background .15s, border-color .15s;
}
.c-item.done .c-box { background: var(--sage); border-color: var(--sage); }
.c-main { flex: 1; min-width: 0; }
.c-text { font-size: 14px; line-height: 1.35; word-break: break-word; }
.c-note { font-size: 11px; color: var(--ink-faint); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
.c-item.done .c-text { text-decoration: line-through; color: var(--ink-faint); }
.c-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.c-item .p-btn {
  width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink-soft);
}
.c-item .p-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.c-item .p-btn-del:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); border-color: var(--danger); }
.c-item .p-grip {
  width: 24px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-faint); font-size: 18px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.c-group-head .c-cat-edit { width: 24px; height: 24px; padding: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.c-group-head .c-cat-edit:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.c-group-head .c-cat-edit svg { width: 13px; height: 13px; }
.c-group.done-group .c-group-head .c-cat { color: var(--sage); }
.c-tag { font-size: 10px; color: var(--ink-soft); background: var(--rule-soft); border-radius: 4px; padding: 1px 5px; margin-right: 6px; vertical-align: 1px; }
.c-empty { font-size: 12px; color: var(--ink-faint); padding: 6px 10px 10px; }
.check-add select.field-input { width: 96px; flex-shrink: 0; }
.check-addcat { flex-shrink: 0; }
.c-item.dragging { opacity: .3; }
.c-item.drop-before { box-shadow: 0 -3px 0 0 var(--accent); }
.c-item.drop-after { box-shadow: 0 3px 0 0 var(--accent); }
.place.dragging { opacity: 0.3; }
.place.focused { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.place.drop-before { box-shadow: 0 -3px 0 0 var(--accent); }
.place.drop-after { box-shadow: 0 3px 0 0 var(--accent); }
.drag-ghost {
  position: fixed; z-index: 200; pointer-events: none; opacity: 0.92; margin: 0;
  box-shadow: var(--shadow-lg); transform: rotate(1deg);
}
.day-tab.drop-target { background: var(--accent-soft); color: var(--accent); border-bottom-color: var(--accent); }
body.dragging-place, body.dragging-place * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.place .p-side { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.place .p-btn {
  width: 28px; height: 28px; margin: -4px 0; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--rule); border-radius: 6px;
  background: var(--paper); color: var(--ink-soft); text-decoration: none;
  transition: background .15s, color .15s, border-color .15s;
}
.place .p-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.place .p-btn-del:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); border-color: var(--danger); }
.place .p-side { gap: 4px; }
.place .p-time {
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
  font-size: 11px;
  flex-shrink: 0;
  text-align: right;
}
.place .p-addr {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 2px;
}
.place .p-memo {
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 4px;
  padding-top: 4px;
  border-top: 1px dashed var(--rule-soft);
  white-space: pre-wrap;
}
.place .p-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.place .p-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip {
  font-size: 10px;
  padding: 2px 8px;
  background: var(--rule-soft);
  color: var(--ink-soft);
  border-radius: 3px;
  letter-spacing: 0.02em;
}
.chip.hours { background: color-mix(in srgb, var(--sage) 15%, transparent); color: var(--sage); }
.chip.closed { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.chip.cost { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
.chip.mode-walk { background: color-mix(in srgb, var(--sage) 15%, transparent); color: var(--sage); }
.chip.mode-transit { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.chip.mode-drive { background: color-mix(in srgb, var(--warm) 20%, transparent); color: var(--warm); }
.chip.mode-flight { background: color-mix(in srgb, var(--marker) 20%, transparent); color: var(--marker); }

/* 날씨 칩 */
.day-weather {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--ink-soft);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  padding: 2px 8px;
  border-radius: 10px;
  margin-left: 8px;
  font-variant-numeric: tabular-nums;
  font-family: 'Noto Sans KR', sans-serif;
  font-style: normal;
}
.day-weather.loading { opacity: 0.5; }
.day-weather-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  margin: 0 0 10px 0;
  background: color-mix(in srgb, var(--accent) 6%, transparent);
  border-left: 2px solid var(--accent);
  border-radius: 4px;
  font-size: 12px;
  color: var(--ink);
}
.day-weather-bar .w-icon { font-size: 18px; }
.day-weather-bar .w-temp { font-weight: 600; font-variant-numeric: tabular-nums; }
.day-weather-bar .w-label { color: var(--ink-soft); }
.day-weather-bar .w-rain { margin-left: auto; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.day-weather-bar .w-src { font-size: 10px; color: var(--ink-faint); }

.place-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--rule-soft);
}
.place-action {
  flex: 1;
  padding: 6px 8px;
  background: var(--rule-soft);
  border: none;
  border-radius: 4px;
  color: var(--ink-soft);
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.place-action:hover { background: var(--rule); color: var(--ink); }
.place-action.primary {
  background: var(--accent);
  color: #fff;
}
.place-action.primary:hover { background: var(--accent); opacity: 0.9; }
.place-action.danger { color: var(--danger); }
.place-action.danger:hover { background: color-mix(in srgb, var(--danger) 15%, transparent); }

.travel-leg {
  padding: 4px 0 4px 10px;
  font-size: 11px;
  color: var(--ink-faint);
  margin-bottom: 10px;
  margin-left: -18px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.travel-leg::before {
  content: '↓';
  color: var(--ink-faint);
}

.add-place-btn {
  margin-top: 8px;
  padding: 14px;
  border: 1px dashed var(--rule);
  border-radius: 8px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 13px;
  background: transparent;
  width: 100%;
  display: block;
}
.add-place-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
@media (max-width: 1024px) {
  .add-place-btn { display: none; }
}

/* 플로팅 추가 버튼 (모바일) */
.fab {
  display: none;
  position: fixed;
  right: 20px;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 54px; height: 54px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 28px;
  border: none;
  box-shadow: 0 6px 20px rgba(31,75,142,0.4);
  z-index: 20;
}
@media (max-width: 1024px) {
  .fab { display: flex; align-items: center; justify-content: center; }
}
.fab:active { transform: scale(0.95); }

/* 모바일 지도 높이 조절 바 */
#map-vresizer { display: none; }
@media (max-width: 1024px) {
  #map-vresizer {
    display: flex; flex: 0 0 22px; align-items: center; justify-content: center;
    touch-action: none; cursor: row-resize; background: var(--paper);
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  }
  #map-vresizer::after { content: ''; width: 44px; height: 4px; border-radius: 2px; background: var(--ink-faint); opacity: .6; }
  #map-vresizer.dragging::after { background: var(--accent); opacity: 1; }
  body.view-check #map-vresizer { display: none; }
}
body.resizing-v { user-select: none; }
body.resizing-v #map-mobile-wrap { pointer-events: none; }

/* ─── Aside: 지도 (desktop) ────────────────────── */
#aside-resizer {
  position: absolute; left: -4px; top: 0; bottom: 0; width: 9px;
  cursor: col-resize; z-index: 30; touch-action: none;
}
#aside-resizer::after {
  content: ''; position: absolute; left: 3px; top: 50%; width: 3px; height: 48px;
  transform: translateY(-50%); border-radius: 2px; background: var(--ink-faint); opacity: 0.45;
  transition: opacity .15s, background .15s;
}
#aside-resizer:hover::after, #aside-resizer.dragging::after { opacity: 1; background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing #map-desktop { pointer-events: none; }
@media (max-width: 1024px) { #aside-resizer { display: none; } }
#aside {
  position: relative;
  background: var(--paper);
  border-left: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
}
#map {
  flex: 1;
  min-height: 100%;
  background: #e8e4d9;
}
#map-mobile-wrap #map { position: absolute; inset: 0; }

/* 지도 위 플로팅 컨트롤 */
.map-controls {
  position: absolute;
  top: 10px; right: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 5;
}
.map-ctrl {
  width: 36px; height: 36px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 6px;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}

.map-legend {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  box-shadow: var(--shadow-sm);
  pointer-events: none;
}

/* ─── Modal 공통 ──────────────────────────────── */
.modal-scrim {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
}
.modal-scrim.show { display: flex; }
.modal {
  background: var(--paper);
  border-radius: 12px;
  width: 100%;
  max-width: 480px;
  max-height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
}
.modal-head {
  padding: 16px 20px 10px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-title {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 18px;
  margin: 0;
}
.modal-close {
  background: none;
  border: none;
  color: var(--ink-faint);
  font-size: 24px;
  line-height: 1;
  padding: 0 4px;
}
.modal-body {
  padding: 16px 20px;
  overflow-y: auto;
  flex: 1;
}
.modal-foot {
  padding: 12px 20px;
  border-top: 1px solid var(--rule);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* 모바일: 전체화면 시트 */
@media (max-width: 1024px) {
  .modal-scrim { padding: 0; align-items: stretch; }
  .modal { max-width: none; border-radius: 0; max-height: 100%; height: 100%; }
}

/* ─── Form ────────────────────────────────────── */
.field { margin-bottom: 14px; }
.field-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 4px;
  display: block;
}
.field-input, .field-select, .field-textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 6px;
  color: var(--ink);
  font-size: 14px;
}
.field-input:focus, .field-select:focus, .field-textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.field-textarea { min-height: 60px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.btn {
  padding: 10px 16px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
  font-weight: 500;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--rule); }
.btn-ghost:hover { background: var(--rule-soft); color: var(--ink); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--rule); }
.btn-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: var(--danger); }

/* 자동완성 결과 */
.autocomplete-wrap { position: relative; }
.autocomplete-results {
  position: absolute;
  top: 100%; left: 0; right: 0;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-top: none;
  border-radius: 0 0 6px 6px;
  box-shadow: var(--shadow-md);
  max-height: 240px;
  overflow-y: auto;
  z-index: 10;
}
.autocomplete-item {
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer;
  font-size: 13px;
}
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover, .autocomplete-item.highlighted { background: var(--accent-soft); }
.autocomplete-item .ac-name {
  font-weight: 500;
  color: var(--ink);
}
.autocomplete-item .ac-name b { color: var(--accent); font-weight: 600; }
.autocomplete-item .ac-addr {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 1px;
}

.selected-place {
  padding: 12px;
  background: var(--accent-soft);
  border-radius: 6px;
  margin-bottom: 12px;
}
.selected-place .sp-name {
  font-weight: 500;
  color: var(--accent);
  font-size: 14px;
}
.selected-place .sp-addr {
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 2px;
}
.selected-place .sp-coord {
  font-size: 10px;
  color: var(--ink-faint);
  font-family: ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}

.mode-picker {
  display: flex;
  gap: 6px;
}
.mode-opt {
  flex: 1;
  padding: 8px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 5px;
  font-size: 12px;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.mode-opt.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* ─── Toast / Empty / Loading ─────────────────── */
#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--ink);
  color: var(--paper);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  z-index: 200;
  transition: transform 0.3s ease;
  box-shadow: var(--shadow-md);
}
#toast.show { transform: translateX(-50%) translateY(0); }

.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--ink-faint);
}
.empty-state h3 {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  color: var(--ink-soft);
  margin: 0 0 8px;
}
.empty-state p { font-size: 13px; margin: 0 0 16px; }

.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--rule);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 지도 info window 커스텀 */
.gm-style .gm-style-iw-c { padding: 0 !important; background: #fff !important; }
.gm-style .gm-style-iw-d { background: #fff; }
.gm-style .gm-style-iw-ch { padding: 0 !important; height: 0 !important; min-height: 0 !important; }
.gm-style .gm-style-iw-chc { height: 0 !important; }
.gm-style .gm-ui-hover-effect { position: absolute !important; top: 2px !important; right: 2px !important; width: 24px !important; height: 24px !important; z-index: 2; }
.gm-style .gm-ui-hover-effect > span { width: 14px !important; height: 14px !important; margin: 5px !important; }
.gm-style .gm-style-iw-d { overflow: auto !important; max-height: none !important; }
.iw-content {

}
.iw-content .iw-memo { font-size: 11px; color: #4a463f; margin-top: 4px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; word-break: break-word; }
.iw-content .iw-name { font-weight: 500; font-size: 13px; color: #1c1b19; }
.iw-content .iw-time { font-size: 11px; color: #6b665d; margin-top: 2px; font-variant-numeric: tabular-nums; }
.iw-content .iw-actions { margin-top: 5px; display: flex; gap: 6px; }
.iw-content .iw-actions a { font-size: 11px; color: #1f4b8e; text-decoration: none; }

/* Google Places Autocomplete 커스텀 */
.pac-container {
  border-radius: 6px;
  border: 1px solid var(--rule);
  box-shadow: var(--shadow-md);
  margin-top: 4px;
  font-family: 'Noto Sans KR', sans-serif;
}
.pac-item { padding: 8px 12px; font-size: 13px; }
.pac-item-query { color: var(--ink); font-size: 14px; }

/* 스크롤바 (desktop) */
@media (hover: hover) {
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }
}

/* Error banner */
.error-banner {
  background: color-mix(in srgb, var(--danger) 15%, var(--paper));
  color: var(--danger);
  padding: 10px 16px;
  font-size: 13px;
  border-bottom: 1px solid var(--danger);
}
</style>
</head>
<body>

<div id="app">

// ───────────────────────────────────────
// 상태
// ───────────────────────────────────────
const state = {
  trips: [],
  currentTripId: null,
  currentTrip: null,
  places: [],
  currentDay: 1,  // 0 = all days view
  editingPlaceId: null,
  selectedPlace: null,       // { name, address, lat, lng, placeId, hours }
  selectedMode: 'WALK',

  markers: [],
  polylines: [],
  myLocationMarker: null,

  weatherFetchedFor: null,  // trip id that weather has been fetched for
};

// ───────────────────────────────────────
// Utils
// ───────────────────────────────────────
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const el = (tag, props = {}, children = []) => {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
};

const toast = (msg, duration = 2500) => {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._tid);
  toast._tid = setTimeout(() => t.classList.remove('show'), duration);
};

const fmtDate = (iso) => {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  const dt = new Date(iso);
  const dow = ['일','월','화','수','목','금','토'][dt.getDay()];
  return `${y}.${m}.${d}(${dow})`;
};
const fmtDateShort = (iso) => {
  if (!iso) return '';
  const [,m,d] = iso.split('-');
  const dt = new Date(iso);
  const dow = ['일','월','화','수','목','금','토'][dt.getDay()];
  return `${parseInt(m)}.${parseInt(d)} ${dow}`;
};
const daysBetween = (startIso, endIso) => {
  const s = new Date(startIso), e = new Date(endIso);
  return Math.round((e - s) / 86400000) + 1;
};
const dateForDay = (startIso, day) => {
  const d = new Date(startIso);
  d.setDate(d.getDate() + day - 1);
  return d.toISOString().slice(0, 10);
};
const todayIso = () => new Date().toISOString().slice(0, 10);

// 위도/경도 거리 (Haversine, m)
const haversine = (a, b) => {
  const R = 6371000, toRad = (x) => x * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
};
const fmtDistance = (m) => m < 1000 ? `${Math.round(m)}m` : `${(m/1000).toFixed(1)}km`;
const estTime = (meters, mode) => {
  // 추정 소요시간 (분)
  const speed = { WALK: 70, TRANSIT: 300, DRIVE: 500, FLIGHT: 12000 };  // m/min
  return Math.max(1, Math.round(meters / (speed[mode] || 70)));
};
const fmtMode = (mode) => ({WALK:'도보', TRANSIT:'대중교통', DRIVE:'차', FLIGHT:'비행기'}[mode] || '도보');
const won = (n) => (n == null || n === '') ? '' : `${Number(n).toLocaleString('ko-KR')}원`;

// ───────────────────────────────────────
// Weather (Open-Meteo, JMA data for Japan)
// ───────────────────────────────────────
const WEATHER_ICONS = {
  0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
  45:'🌫️', 48:'🌫️',
  51:'🌦️', 53:'🌦️', 55:'🌦️', 56:'🌦️', 57:'🌦️',
  61:'🌧️', 63:'🌧️', 65:'🌧️', 66:'🌧️', 67:'🌧️',
  71:'🌨️', 73:'🌨️', 75:'🌨️', 77:'🌨️',
  80:'🌦️', 81:'🌧️', 82:'🌧️',
  85:'🌨️', 86:'🌨️',
  95:'⛈️', 96:'⛈️', 99:'⛈️',
};
const WEATHER_LABELS = {
  0:'맑음', 1:'대체로 맑음', 2:'구름 조금', 3:'흐림',
  45:'안개', 48:'안개',
  51:'약한 이슬비', 53:'이슬비', 55:'강한 이슬비', 56:'어는 이슬비', 57:'어는 이슬비',
  61:'약한 비', 63:'비', 65:'강한 비', 66:'어는 비', 67:'어는 비',
  71:'약한 눈', 73:'눈', 75:'강한 눈', 77:'싸락눈',
  80:'소나기', 81:'소나기', 82:'강한 소나기',
  85:'눈 소나기', 86:'강한 눈 소나기',
  95:'뇌우', 96:'뇌우', 99:'강한 뇌우',
};

const getDayLocation = (day) => {
  const places = state.places.filter(p => p.day === day && typeof p.lat === 'number' && typeof p.lng === 'number');
  if (!places.length) return null;
  const lats = places.map(p => p.lat).sort((a,b) => a-b);
  const lngs = places.map(p => p.lng).sort((a,b) => a-b);
  return { lat: lats[Math.floor(lats.length/2)], lng: lngs[Math.floor(lngs.length/2)] };
};

const fetchWeatherAt = async (lat, lng) => {
  const key = `${lat.toFixed(2)},${lng.toFixed(2)}`;
  if (state.weatherCache[key]) return false;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(2)}&longitude=${lng.toFixed(2)}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&timezone=Asia%2FTokyo&forecast_days=16`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('weather fetch failed: ' + resp.status);
    const data = await resp.json();
    const d = data.daily || {};
    const byDate = {};
    for (let i = 0; i < (d.time || []).length; i++) {
      byDate[d.time[i]] = {
        code: d.weather_code[i],
        tmax: d.temperature_2m_max[i],
        tmin: d.temperature_2m_min[i],
        pop: d.precipitation_probability_max[i],
        rain: d.precipitation_sum[i],
      };
    }
    state.weatherCache[key] = byDate;
    return true;
  } catch (err) {
    console.warn('weather fetch failed', err);
    return false;
  }
};

const fetchWeatherForTrip = async (trip) => {
  if (!trip || !trip.startDate || !trip.endDate) return;
  if (state.weatherFetchedFor === trip.id) return;
  state.weatherFetchedFor = trip.id;
  const totalDays = daysBetween(trip.startDate, trip.endDate);
  const keys = new Set();
  for (let d = 1; d <= totalDays; d++) {
    const loc = getDayLocation(d);
    if (loc) keys.add(`${loc.lat.toFixed(2)},${loc.lng.toFixed(2)}`);
  }
  if (!keys.size) keys.add('34.99,135.76'); // Kyoto fallback
  const changed = (await Promise.all([...keys].map(k => {
    const [lat, lng] = k.split(',').map(Number);
    return fetchWeatherAt(lat, lng);
  }))).some(Boolean);
  if (changed) renderPlaces();
};

const getWeatherForDay = (day) => {
  const t = state.currentTrip;
  if (!t || !t.startDate) return null;
  const dateIso = dateForDay(t.startDate, day);
  const loc = getDayLocation(day);
  if (!loc) {
    // fallback: try any cached location
    const anyKey = Object.keys(state.weatherCache)[0];
    if (!anyKey) return null;
    return state.weatherCache[anyKey][dateIso] || null;
  }
  const key = `${loc.lat.toFixed(2)},${loc.lng.toFixed(2)}`;
  const bucket = state.weatherCache[key];
  if (!bucket) return null;
  return bucket[dateIso] || null;
};

const makeWeatherChip = (day) => {
  const w = getWeatherForDay(day);
  if (!w) return null;
  const icon = WEATHER_ICONS[w.code] || '🌡️';
  const temp = `${Math.round(w.tmax)}°/${Math.round(w.tmin)}°`;
  const pop = w.pop != null ? ` · ☔${w.pop}%` : '';
  const label = WEATHER_LABELS[w.code] || '';
  return el('span', {
    class: 'day-weather',
    title: `${label}, 강수량 ${w.rain || 0}mm`
  }, `${icon} ${temp}${pop}`);
};

const makeWeatherBar = (day) => {
  const w = getWeatherForDay(day);
  if (!w) return null;
  const icon = WEATHER_ICONS[w.code] || '🌡️';
  const label = WEATHER_LABELS[w.code] || '';
  const temp = `${Math.round(w.tmax)}° / ${Math.round(w.tmin)}°`;
  const popStr = w.pop != null ? `☔ ${w.pop}%` : '';
  const rainStr = (w.rain != null && w.rain > 0) ? ` · ${w.rain}mm` : '';
  return el('div', { class: 'day-weather-bar' }, [
    el('span', { class: 'w-icon' }, icon),
    el('span', { class: 'w-temp' }, temp),
    el('span', { class: 'w-label' }, label),
    el('span', { class: 'w-rain' }, popStr + rainStr),
    el('span', { class: 'w-src', title: '날씨: Open-Meteo (JMA 데이터)' }, '· Open-Meteo'),
  ]);
};

// ───────────────────────────────────────
// Firestore CRUD
// ───────────────────────────────────────
const subscribeTrips = () => {
  if (state.tripsUnsub) state.tripsUnsub();
  const q = query(collection(db, 'trips'), orderBy('startDate', 'desc'));
  state.tripsUnsub = onSnapshot(q, (snap) => {
    state.trips = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTripsList();
    // Current trip 삭제 감지
    if (state.currentTripId && !state.trips.find(t => t.id === state.currentTripId)) {
      state.currentTripId = null;
      state.currentTrip = null;
      renderCurrentTrip();
    } else if (state.currentTripId) {
      state.currentTrip = state.trips.find(t => t.id === state.currentTripId);
      renderCurrentTrip();
    }
  }, (err) => {
    console.error('trips snapshot error', err);
    showError('여행 목록을 불러오지 못했습니다. 네트워크 또는 Firebase 규칙을 확인하세요.');
  });
};

const subscribeChecklist = (tripId) => {
  if (state.checklistUnsub) { state.checklistUnsub(); state.checklistUnsub = null; }
  state.checklist = [];
  if (!tripId) { updateCheckTab(); return; }
  state.checklistUnsub = onSnapshot(collection(db, 'trips', tripId, 'checklist'), (snap) => {
    state.checklist = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.orderNo || 0) - (b.orderNo || 0));
    updateCheckTab();
    if (state.currentDay === -1) renderChecklistBody();
  }, (err) => console.error('checklist snapshot error', err));
};
const saveCheckItem = async (tripId, data) => {
  const { id, ...rest } = data;
  if (id) { await updateDoc(doc(db, 'trips', tripId, 'checklist', id), rest); return id; }
  const newId = 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  await setDoc(doc(db, 'trips', tripId, 'checklist', newId), { ...rest, createdAt: serverTimestamp() });
  return newId;
};
const deleteCheckItem = (tripId, id) => deleteDoc(doc(db, 'trips', tripId, 'checklist', id));

const subscribePlaces = (tripId) => {
  subscribeChecklist(tripId);
  if (state.placesUnsub) state.placesUnsub();
  if (!tripId) {
    state.places = [];
    renderPlaces();
    return;
  }
  // orderBy 체인은 Firestore composite index를 요구하므로, 서버 정렬은 생략하고 클라이언트에서 정렬
  const q = collection(db, 'trips', tripId, 'places');
  state.placesUnsub = onSnapshot(q, (snap) => {
    state.places = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.day - b.day) || (a.orderNo - b.orderNo));
    renderPlaces();
    renderMap();
    // 장소 좌표를 바탕으로 날씨 fetch (한 여행당 1회)
    fetchWeatherForTrip(state.currentTrip);
  }, (err) => {
    console.error('places snapshot error', err);
  });
};

const saveTrip = async (data) => {
  const { id, ...rest } = data;
  if (id) {
    await updateDoc(doc(db, 'trips', id), rest);
    return id;
  } else {
    const newId = 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await setDoc(doc(db, 'trips', newId), { ...rest, createdAt: serverTimestamp() });
    return newId;
  }
};
const deleteTrip = async (id) => {
  // 서브컬렉션 places도 모두 삭제
  const placesSnap = await getDocs(collection(db, 'trips', id, 'places'));
  const batch = writeBatch(db);
  placesSnap.docs.forEach(d => batch.delete(d.ref));
  const checkSnap = await getDocs(collection(db, 'trips', id, 'checklist'));
  checkSnap.docs.forEach(d => batch.delete(d.ref));
  batch.delete(doc(db, 'trips', id));
  await batch.commit();
};

const savePlace = async (tripId, data) => {
  const { id, ...rest } = data;
  if (id) {
    await updateDoc(doc(db, 'trips', tripId, 'places', id), rest);
    return id;
  } else {
    const newId = 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await setDoc(doc(db, 'trips', tripId, 'places', newId), { ...rest, createdAt: serverTimestamp() });
    return newId;
  }
};
const deletePlace = async (tripId, placeId) => {
  await deleteDoc(doc(db, 'trips', tripId, 'places', placeId));
};

// ───────────────────────────────────────
// 렌더링
// ───────────────────────────────────────
const renderTripsList = () => {
  const list = $('#trips-list');
  list.innerHTML = '';
  if (!state.trips.length) {
    list.appendChild(el('div', { class: 'empty-state', style: 'padding: 20px 10px;' }, [
      el('p', { style: 'font-size: 12px;' }, '아직 여행이 없습니다.')
    ]));
    return;
  }
  state.trips.forEach(t => {
    const total = (t.startDate && t.endDate) ? daysBetween(t.startDate, t.endDate) : 0;
    const dates = (t.startDate && t.endDate)
      ? `${t.startDate.slice(2).replace(/-/g,'.')}–${t.endDate.slice(5).replace(/-/g,'.')} · ${total}일`
      : '';
    const delBtn = el('button', {
      class: 'trip-item-del',
      title: '여행 삭제',
      'aria-label': '여행 삭제',
      onclick: async (e) => {
        e.stopPropagation();
        const placesCount = (t.id === state.currentTripId) ? state.places.length : null;
        const countTxt = placesCount != null ? `\n포함된 장소 ${placesCount}개도 모두 사라집니다.` : '\n포함된 모든 장소도 함께 사라집니다.';
        const msg = `⚠️ 정말 삭제하시겠습니까?\n\n여행: "${t.title}"${countTxt}\n\n이 작업은 되돌릴 수 없습니다.`;
        if (!confirm(msg)) return;
        try {
          await deleteTrip(t.id);
          toast('여행이 삭제되었습니다');
          if (state.currentTripId === t.id) {
            state.currentTripId = null;
            state.currentTrip = null;
            renderCurrentTrip();
            subscribePlaces(null);
            updateUrl();
          }
        } catch (err) {
          console.error(err); toast('삭제 실패: ' + err.message);
        }
      },
    }, '🗑');
    const item = el('div', {
      class: 'trip-item' + (t.id === state.currentTripId ? ' active' : ''),
      onclick: () => selectTrip(t.id),
    }, [
      el('div', { class: 't-title' }, t.title || '(제목 없음)'),
      el('div', { class: 't-date' }, dates),
      delBtn,
    ]);
    list.appendChild(item);
  });
};

const renderCurrentTrip = () => {
  const t = state.currentTrip;
  if (!t) {
    $('#trip-title').textContent = '여행을 선택하세요';
    $('#trip-title-mobile').textContent = '여행을 선택하세요';
    $('#trip-dates').textContent = '';
    $('#trip-meta').innerHTML = '';
    $('#day-tabs').innerHTML = '';
    $('#btn-add-place-header').style.display = 'none';
    $('#places-list').innerHTML = `<div class="empty-state"><h3>트립노트</h3><p>왼쪽에서 여행을 선택하거나 새로 만드세요.</p></div>`;
    return;
  }
  $('#trip-title').textContent = t.title || '(제목 없음)';
  $('#trip-title-mobile').textContent = t.title || '(제목 없음)';
  $('#btn-add-place-header').style.display = '';
  const dates = (t.startDate && t.endDate)
    ? `${fmtDate(t.startDate)} – ${fmtDate(t.endDate)}`
    : '';
  $('#trip-dates').textContent = dates;

  // Day 탭
  const totalDays = (t.startDate && t.endDate) ? daysBetween(t.startDate, t.endDate) : 1;
  if (state.currentDay > totalDays) state.currentDay = 1;
  const tabsEl = $('#day-tabs');
  tabsEl.innerHTML = '';
  // All days 탭
  tabsEl.appendChild(el('button', {
    class: 'day-tab all-days' + (state.currentDay === 0 ? ' active' : ''),
    onclick: () => { state.currentDay = 0; updateUrl(); renderCurrentTrip(); renderPlaces(); renderMap(); }
  }, '전체'));
  for (let d = 1; d <= totalDays; d++) {
    const dateIso = dateForDay(t.startDate, d);
    tabsEl.appendChild(el('button', {
      class: 'day-tab' + (state.currentDay === d ? ' active' : ''),
      onclick: () => { state.currentDay = d; updateUrl(); renderCurrentTrip(); renderPlaces(); renderMap(); }
    }, [
      el('span', { class: 'd-num' }, `D${d}`),
      t.startDate ? ` ${fmtDateShort(dateIso)}` : ''
    ]));
  }

  // 준비(체크리스트) 탭: 맨 오른쪽
  tabsEl.appendChild(el('button', {
    class: 'day-tab check-tab' + (state.currentDay === -1 ? ' active' : ''),
    onclick: () => { state.currentDay = -1; updateUrl(); renderCurrentTrip(); renderPlaces(); renderMap(); }
  }, '✓ 준비'));
  updateCheckTab();

  $$('.day-tab:not(.all-days):not(.check-tab)', tabsEl).forEach((t, i) => { t.dataset.day = i + 1; });

  // Meta: 비용 합계
  renderTripMeta();
  // 중요: 중앙 영역을 Day에 맞게 다시 렌더
  renderPlaces();
  // 지도도 다시 그리기 (places 로드 실패해도 레전드만이라도)
  if (!state.map) ensureMap();
  renderMap();
};

const renderTripMeta = () => {
  const metaEl = $('#trip-meta');
  metaEl.innerHTML = '';
  if (!state.currentTrip) return;
  const dayPlaces = state.currentDay <= 0
    ? state.places
    : state.places.filter(p => p.day === state.currentDay);
  const total = dayPlaces.reduce((s, p) => s + (Number(p.cost) || 0), 0);
  if (total > 0) {
    metaEl.appendChild(el('span', { class: 'cost-sum' }, `예상 ${won(total)}`));
  }
  if (dayPlaces.length > 0) {

    metaEl.appendChild(el('span', { class: 'export-btns' }, [
      el('button', { class: 'export-btn', title: '엑셀에서 열 수 있는 CSV로 내려받기', onclick: () => exportTrip('csv') }, '⬇ CSV'),
      el('button', { class: 'export-btn', title: '백업용 JSON으로 내려받기', onclick: () => exportTrip('json') }, '⬇ JSON'),

// 여행 내보내기 (CSV: 엑셀/구글시트용, JSON: 백업용)
const downloadFile = (filename, text, mime) => {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
const exportTrip = (kind) => {
  const t = state.currentTrip;
  if (!t) return;
  const places = [...state.places].sort((a, b) => (a.day - b.day) || (a.orderNo - b.orderNo));
  const safeTitle = (t.title || 'trip').replace(/[\\/:*?"<>|]/g, '_');
  const stamp = todayIso().replace(/-/g, '');
  if (kind === 'json') {
    const data = { exportedAt: new Date().toISOString(), trip: { id: t.id, title: t.title, startDate: t.startDate, endDate: t.endDate },
      places: places.map(({ createdAt, ...rest }) => rest),
      checklist: state.checklist.map(({ createdAt, ...rest }) => rest) };
    downloadFile(`${safeTitle}_${stamp}.json`, JSON.stringify(data, null, 2), 'application/json');
  } else {
    const q = (v) => { const x = String(v ?? ''); return /[",\n\r]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
    const header = ['날짜', 'Day', '순서', '장소명', '주소', '도착', '출발', '이동수단(다음 장소까지)', '비용(원)', '메모', '위도', '경도', '구글맵 링크'];
    const rows = places.map(p => [
      t.startDate ? dateForDay(t.startDate, p.day) : '', p.day, p.orderNo, p.name, p.address, p.arriveTime, p.departTime,
      fmtMode(p.transitMode || 'WALK'), p.cost || '', p.memo, p.lat ?? '', p.lng ?? '',
      (p.lat != null && p.lng != null) ? `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}` + (p.placeId ? `&query_place_id=${encodeURIComponent(p.placeId)}` : '') : '',
    ].map(q).join(','));
    // BOM 포함 → 엑셀에서 한글 깨짐 방지
    downloadFile(`${safeTitle}_${stamp}.csv`, '\uFEFF' + [header.map(q).join(','), ...rows].join('\r\n'), 'text/csv;charset=utf-8');
  }
  toast('내려받았습니다');
};

const renderPlaces = () => {
  const list = $('#places-list');
  const wasCheck = document.body.classList.contains('view-check');
  const isCheck = !!state.currentTrip && state.currentDay === -1;
  document.body.classList.toggle('view-check', isCheck);
  if (isCheck) {
    if (!$('#check-root')) { list.innerHTML = ''; buildChecklistShell(list); }
    renderChecklistBody();
    return;
  }
  if (wasCheck && state.map && window.google) {
    // 모바일에서 지도가 숨겨져 있던 뒤 다시 보일 때 크기·범위 재계산
    setTimeout(() => { google.maps.event.trigger(state.map, 'resize'); fitMapBounds(false); }, 60);
  }
  list.innerHTML = '';
  if (!state.currentTrip) return;

  const dayPlaces = state.currentDay === 0
    ? state.places
    : state.places.filter(p => p.day === state.currentDay);

  if (!dayPlaces.length) {
    const dayLabel = state.currentDay === 0 ? '전체' : `Day ${state.currentDay}`;
    list.appendChild(el('div', { class: 'empty-state', style: 'padding: 60px 20px;' }, [
      el('h3', {}, dayLabel + '에 아직 장소가 없습니다'),
      el('p', {}, '검색으로 장소를 추가하면 지도에 핀이 생기고\n여행 동선이 자동으로 그려집니다.'),
      el('button', { class: 'btn btn-primary', style: 'margin-top:12px; padding:12px 20px; font-size:14px;', onclick: () => openPlaceModal() }, '＋ 장소 추가'),
    ]));
    return;
  }

  const timeline = el('div', { class: 'timeline' });
  const nowDate = todayIso();
  const nowTime = new Date().toTimeString().slice(0, 5);
  const isToday = state.currentTrip.startDate && (dateForDay(state.currentTrip.startDate, state.currentDay) === nowDate);

  // 특정 날짜 뷰: 상단에 날씨 바
  if (state.currentDay > 0) {
    const bar = makeWeatherBar(state.currentDay);
    if (bar) list.appendChild(bar);
  }

  // All days 뷰에서는 day별로 그루핑
  if (state.currentDay === 0) {
    const byDay = {};
    dayPlaces.forEach(p => { (byDay[p.day] = byDay[p.day] || []).push(p); });
    Object.keys(byDay).sort((a,b) => a-b).forEach(d => {
      const dNum = Number(d);
      const heading = el('div', {
        style: 'font-family: Fraunces, serif; font-style: italic; color: var(--ink-faint); margin: 12px 0 6px; margin-left: -18px; display: flex; align-items: center;'
      }, [`Day ${d}`]);
      const chip = makeWeatherChip(dNum);
      if (chip) heading.appendChild(chip);
      timeline.appendChild(heading);
      byDay[d].forEach((p, i) => appendPlace(timeline, p, i + 1, byDay[d][i+1], false));
    });
  } else {
    dayPlaces.forEach((p, i) => {
      appendPlace(timeline, p, i + 1, dayPlaces[i + 1], isToday && isNow(p, dayPlaces[i+1], nowTime));
    });
  }
  list.appendChild(timeline);
  list.appendChild(el('button', { class: 'add-place-btn', onclick: () => openPlaceModal() }, '＋ 장소 추가'));
};

const isNow = (place, next, nowTime) => {
  if (!place.arriveTime) return false;
  const endTime = place.departTime || next?.arriveTime || '23:59';
  return place.arriveTime <= nowTime && nowTime <= endTime;
};

      el('button', {
        class: 'p-btn', title: '수정', 'aria-label': '수정', html: ICON.edit,

const startPlaceDrag = (e, p, card) => {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const tripId = state.currentTripId;
  const list = $('#places-list');
  const rect = card.getBoundingClientRect();
  const offY = e.clientY - rect.top;
  const ghost = card.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  card.classList.add('dragging');
  document.body.classList.add('dragging-place');

  let target = null;  // { type:'card', id, after } | { type:'tab', day }
  let lastY = e.clientY;
  const clearMarks = () => {
    $$('.drop-before, .drop-after, .drop-target').forEach(n => n.classList.remove('drop-before', 'drop-after', 'drop-target'));
  };
  const update = (x, y) => {
    lastY = y;
    ghost.style.top = (y - offY) + 'px';
    clearMarks(); target = null;
    const hit = document.elementFromPoint(x, y);
    if (!hit) return;
    const tab = hit.closest('.day-tab[data-day]');
    if (tab) { tab.classList.add('drop-target'); target = { type: 'tab', day: Number(tab.dataset.day) }; return; }
    const c = hit.closest('.place[data-pid]');
    if (c && c !== card) {
      const r = c.getBoundingClientRect();
      const after = y > r.top + r.height / 2;
      c.classList.add(after ? 'drop-after' : 'drop-before');
      target = { type: 'card', id: c.dataset.pid, after };
    }
  };
  const onMove = (ev) => update(ev.clientX, ev.clientY);
  // 가장자리 자동 스크롤
  const timer = setInterval(() => {
    const lr = list.getBoundingClientRect();
    if (lastY < lr.top + 50) list.scrollTop -= 12;
    else if (lastY > lr.bottom - 50) list.scrollTop += 12;
  }, 16);
  const cleanup = () => {
    clearInterval(timer);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    ghost.remove(); card.classList.remove('dragging');
    document.body.classList.remove('dragging-place');
    clearMarks();
  };
  const onCancel = () => cleanup();
  const onUp = async () => {
    const t = target;
    cleanup();
    if (!t) return;
    await movePlace(tripId, p.id, t);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
};

const movePlace = async (tripId, id, t) => {
  const moving = state.places.find(x => x.id === id);
  if (!moving) return;
  let destDay, destList;
  const others = (d) => state.places.filter(x => x.day === d && x.id !== id);
  if (t.type === 'tab') {
    destDay = t.day;
    destList = others(destDay).concat(moving);
  } else {
    const ref = state.places.find(x => x.id === t.id);
    if (!ref) return;
    destDay = ref.day;
    destList = others(destDay);
    const idx = destList.findIndex(x => x.id === ref.id);
    destList.splice(t.after ? idx + 1 : idx, 0, moving);
  }
  const srcDay = moving.day;
  const batch = writeBatch(db);
  let changed = 0;
  const apply = (arr, day) => arr.forEach((pl, i) => {
    if (pl.day !== day || pl.orderNo !== i + 1) {
      batch.update(doc(db, 'trips', tripId, 'places', pl.id), { day, orderNo: i + 1 });
      changed++;
    }
  });
  apply(destList, destDay);
  if (srcDay !== destDay) apply(others(srcDay), srcDay);
  if (!changed) return;
  try {
    await batch.commit();
    toast(srcDay !== destDay ? `Day ${destDay}(으)로 이동했습니다` : '순서를 변경했습니다');
  } catch (err) {
    console.error(err); toast('이동 실패: ' + err.message);
  }
};

  state.checklist.forEach(i => { const c = i.category || '기타'; if (!cats.includes(c)) cats.push(c); });

const renderChecklistBody = () => {
  const root = $('#check-root');

  if (sel) fillCatSelect(sel, state.lastCheckCat);
  let box = $('#check-groups');
  if (!box) { box = el('div', { id: 'check-groups' }); root.appendChild(box); }
  box.innerHTML = '';

  const mkGroup = (key, label, count, cls) => {
    const collapsed = !!state.checkCollapsed[key];
    const group = el('div', { class: 'c-group' + (cls ? ' ' + cls : '') });
    const head = el('div', { class: 'c-group-head', onclick: () => { state.checkCollapsed[key] = !collapsed; renderChecklistBody(); } }, [
      el('span', {}, collapsed ? '▸' : '▾'),
      el('span', { class: 'c-cat' }, label),
    ]);
    if (key !== DONE_KEY) {
      head.dataset.cat = key;
      head.appendChild(el('button', { class: 'c-cat-edit', type: 'button', title: '분류 수정·삭제', 'aria-label': '분류 수정', html: ICON.edit, onclick: (e) => { e.stopPropagation(); openCatModal(key); } }));
    }
    head.appendChild(el('span', { class: 'c-cat-count' }, count));
    group.appendChild(head);
    box.appendChild(group);
    return { group, collapsed };
  };

  checkCats().forEach(cat => {
    const all = state.checklist.filter(i => (i.category || '기타') === cat);
    const todo = all.filter(i => !i.done);
    if (state.checkHideDone && !todo.length) return;
    const { group, collapsed } = mkGroup(cat, cat, `${all.length - todo.length}/${all.length}`, '');
    if (collapsed) return;
    // 완료 항목을 해당 분류의 맨 위로
    const shown = state.checkHideDone ? todo : [...all.filter(i => i.done), ...todo];
    shown.forEach(it => group.appendChild(buildCheckItem(it, false)));
    if (!shown.length) group.appendChild(el('div', { class: 'c-empty' }, '항목 없음 — 다른 분류에서 끌어 오거나 위에서 추가하세요'));
  });
  if (!t && !checkCats().length) return;
};

// 항목 수정 모달 (분류 이동 포함)
const openCheckModal = (it) => {
  state.editingCheckId = it.id;
  $('#check-text-edit').value = it.text || '';

$('#btn-save-check').onclick = async () => {

$('#btn-delete-check').onclick = async () => {

// 분류 추가/수정/삭제/순서
const openCatModal = (cat) => {
  state.editingCat = cat;
  $('#cat-modal-title').textContent = cat ? '분류 수정' : '분류 추가';
  $('#cat-name-edit').value = cat || '';
  $('#btn-delete-cat').style.display = cat ? '' : 'none';
  $('#cat-order-row').style.display = cat ? '' : 'none';
  openModal('modal-cat');
  setTimeout(() => $('#cat-name-edit').focus(), 50);
};
$('#btn-save-cat').onclick = async () => {
  const name = $('#cat-name-edit').value.trim();
  if (!name) { toast('분류 이름을 입력하세요'); return; }
  const cats = checkCats();
  const old = state.editingCat;
  if (name === old) { closeModal('modal-cat'); return; }
  if (cats.includes(name)) { toast('이미 있는 분류입니다'); return; }
  try {
    if (!old) {
      await saveCats([...cats, name]);
      state.lastCheckCat = name;
    } else {
      const batch = writeBatch(db);
      batch.update(doc(db, 'trips', state.currentTripId), { checkCats: cats.map(c => c === old ? name : c) });
      state.checklist.filter(i => (i.category || '기타') === old)
        .forEach(i => batch.update(doc(db, 'trips', state.currentTripId, 'checklist', i.id), { category: name }));
      await batch.commit();
      if (state.lastCheckCat === old) state.lastCheckCat = name;
      if (state.checkCollapsed[old] !== undefined) { state.checkCollapsed[name] = state.checkCollapsed[old]; delete state.checkCollapsed[old]; }
    }
    closeModal('modal-cat');
  } catch (err) { console.error(err); toast('저장 실패: ' + err.message); }
};
$('#cat-name-edit').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#btn-save-cat').click(); } });
$('#btn-delete-cat').onclick = async () => {
  const old = state.editingCat;
  const cats = checkCats();
  if (!old) return;
  if (cats.length <= 1) { toast('분류는 최소 1개가 필요합니다'); return; }
  const rest = cats.filter(c => c !== old);
  const fallback = rest.includes('기타') ? '기타' : rest[0];
  const items = state.checklist.filter(i => (i.category || '기타') === old);
  const msg = items.length
    ? `"${old}" 분류를 삭제하시겠습니까?\n안의 항목 ${items.length}개는 "${fallback}"(으)로 이동됩니다.`
    : `"${old}" 분류를 삭제하시겠습니까?`;
  if (!confirm(msg)) return;
  try {
    const batch = writeBatch(db);
    batch.update(doc(db, 'trips', state.currentTripId), { checkCats: rest });
    items.forEach(i => batch.update(doc(db, 'trips', state.currentTripId, 'checklist', i.id), { category: fallback }));
    await batch.commit();
    if (state.lastCheckCat === old) state.lastCheckCat = fallback;
    closeModal('modal-cat');
  } catch (err) { console.error(err); toast('삭제 실패: ' + err.message); }
};
const moveCat = async (dir) => {
  const old = state.editingCat;
  const cats = checkCats();
  const i = cats.indexOf(old), j = i + dir;
  if (i < 0 || j < 0 || j >= cats.length) return;
  [cats[i], cats[j]] = [cats[j], cats[i]];
  try { await saveCats(cats); closeModal('modal-cat'); } catch (err) { console.error(err); toast('이동 실패: ' + err.message); }
};
$('#btn-cat-up').onclick = () => moveCat(-1);
$('#btn-cat-down').onclick = () => moveCat(1);

// 드래그로 순서/분류 이동
const startCheckDrag = (e, it, row) => {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const tripId = state.currentTripId;
  const list = $('#places-list');
  const rect = row.getBoundingClientRect();
  const offY = e.clientY - rect.top;
  const ghost = row.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  row.classList.add('dragging');
  document.body.classList.add('dragging-place');
  let target = null, lastY = e.clientY;
  const clearMarks = () => $$('.drop-before, .drop-after, .drop-target').forEach(n => n.classList.remove('drop-before', 'drop-after', 'drop-target'));
  const onMove = (ev) => {
    lastY = ev.clientY;
    ghost.style.top = (ev.clientY - offY) + 'px';
    clearMarks(); target = null;
    const hit = document.elementFromPoint(ev.clientX, ev.clientY);
    if (!hit) return;
    const item = hit.closest('.c-item[data-id]');
    if (item && item !== row && !item.closest('.done-group')) {
      const r = item.getBoundingClientRect();
      const after = ev.clientY > r.top + r.height / 2;
      item.classList.add(after ? 'drop-after' : 'drop-before');
      target = { type: 'item', id: item.dataset.id, after };
      return;
    }
    const head = hit.closest('.c-group-head[data-cat]');
    if (head) { head.classList.add('drop-target'); target = { type: 'head', cat: head.dataset.cat }; }
  };
  const timer = setInterval(() => {
    const lr = list.getBoundingClientRect();
    if (lastY < lr.top + 50) list.scrollTop -= 12;
    else if (lastY > lr.bottom - 50) list.scrollTop += 12;
  }, 16);
  const cleanup = () => {
    clearInterval(timer);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', cleanup);
    ghost.remove(); row.classList.remove('dragging');
    document.body.classList.remove('dragging-place');
    clearMarks();
  };
  const onUp = async () => {
    const t = target;
    cleanup();
    if (t) await moveCheckItem(tripId, it.id, t);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', cleanup);
};

const moveCheckItem = async (tripId, id, t) => {
  const moving = state.checklist.find(x => x.id === id);
  if (!moving) return;
  const cats = checkCats();
  const groups = {};
  cats.forEach(c => { groups[c] = []; });
  state.checklist.filter(x => x.id !== id).forEach(x => groups[x.category || '기타'].push(x));
  if (t.type === 'head') {
    groups[t.cat].push(moving);
  } else {
    const ref = state.checklist.find(x => x.id === t.id);
    if (!ref) return;
    const arr = groups[ref.category || '기타'];
    const idx = arr.findIndex(x => x.id === ref.id);
    arr.splice(t.after ? idx + 1 : idx, 0, moving);
  }
  const batch = writeBatch(db);
  let n = 0, i = 0;
  cats.forEach(c => groups[c].forEach(x => {
    i++;
    if (x.orderNo !== i || (x.category || '기타') !== c) {
      batch.update(doc(db, 'trips', tripId, 'checklist', x.id), { orderNo: i, category: c });
      n++;
    }
  }));
  if (!n) return;
  try { await batch.commit(); } catch (err) { console.error(err); toast('이동 실패: ' + err.message); }
};

// ───────────────────────────────────────
// Map rendering
// ───────────────────────────────────────
const MAP_COLORS = { WALK: '#6b8e5a', TRANSIT: '#1f4b8e', DRIVE: '#e0a74e', FLIGHT: '#c0392b' };

const ensureMap = () => {
  if (state.map) return;
  const isMobile = window.matchMedia('(max-width: 1024px)').matches;
  const mapDiv = isMobile ? el('div', { style: 'position:absolute; inset:0;' }) : $('#map-desktop');
  if (isMobile) {
    const wrap = $('#map-mobile-wrap');
    wrap.innerHTML = '';
    wrap.appendChild(mapDiv);
    const ctrls = el('div', { class: 'map-controls', html: `
      <button class="map-ctrl" id="btn-my-location-m" title="내 위치">⌖</button>
      <button class="map-ctrl" id="btn-fit-bounds-m" title="전체 보기">⤢</button>
    `});
    wrap.appendChild(ctrls);
    wrap.appendChild(el('div', { class: 'map-legend', id: 'map-legend-m' }));
    $('#btn-my-location-m').onclick = showMyLocation;
    $('#btn-fit-bounds-m').onclick = () => fitMapBounds(true);
  }
  state.map = new google.maps.Map(mapDiv, {
    center: { lat: 35.68, lng: 139.76 }, // Tokyo default
    zoom: 11,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false,
    gestureHandling: 'greedy',
  });
  // 지도 생성 직후 영역 크기가 재조정되면 타일이 안 뜨는 Google Maps 특성 → resize 강제 트리거
  setTimeout(() => {
    try {
      const center = state.map.getCenter();
      google.maps.event.trigger(state.map, 'resize');
      state.map.setCenter(center);
    } catch (e) {}
  }, 300);
};

const clearMap = () => {
  state.markers.forEach(m => m.setMap(null));
  state.markers = [];
  state.polylines.forEach(p => p.setMap(null));
  state.polylines = [];
};

// 카드 ↔ 지도 연동: 카드를 누르면 해당 장소로 지도 이동 + 강조
const highlightFocus = () => {
  $$('.place.focused').forEach(n => n.classList.remove('focused'));
  if (state.focusedPlaceId) {
    const c = $(`.place[data-pid="${state.focusedPlaceId}"]`);
    if (c) c.classList.add('focused');
  }
  state.markers.forEach(m => {
    const on = m.__pid === state.focusedPlaceId;
    const ic = m.getIcon();
    if (ic) m.setIcon({ ...ic, scale: on ? 18 : 14, fillColor: on ? '#d9822b' : '#1f4b8e' });
    m.setZIndex(on ? 999 : null);
  });
};
const focusPlaceOnMap = (p, fromMarker) => {
  if (p.lat == null || p.lng == null) { toast('이 장소는 지도 좌표가 없어 지도에 표시할 수 없습니다'); return; }
  state.focusedPlaceId = p.id;
  if (!state.map) ensureMap();
  if (!state.map) return;
  const m = state.markers.find(x => x.__pid === p.id);
  if (state.openInfo) state.openInfo.close();
  if (!fromMarker) {
    state.map.panTo({ lat: p.lat, lng: p.lng });
    if ((state.map.getZoom() || 0) < 16) state.map.setZoom(16);
  }
  if (m && m.__info) { m.__info.open(state.map, m); state.openInfo = m.__info; }
  highlightFocus();
  // 마커 클릭 시에는 해당 카드가 보이도록 목록 스크롤
  if (fromMarker) { const c = $(`.place[data-pid="${p.id}"]`); if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
};

const renderMap = () => {
  if (!state.map) return;
  clearMap();
  if (!state.currentTrip) {
    showLegend('');
    return;
  }

  const toShow = state.currentDay <= 0 ? state.places : state.places.filter(p => p.day === state.currentDay);
  const placesWithCoord = toShow.filter(p => p.lat && p.lng);
  if (!placesWithCoord.length) {
    showLegend('장소를 추가하면 지도에 표시됩니다');
    return;
  }

  // Group by day for coloring (all-days 뷰에서만 의미 있음)
  const dayGroups = {};
  placesWithCoord.forEach(p => {
    (dayGroups[p.day] = dayGroups[p.day] || []).push(p);
  });

  // 각 그룹별 순서 유지 (이미 orderNo로 정렬돼 있음)
  Object.entries(dayGroups).forEach(([day, dayPs]) => {
    dayPs.forEach((p, i) => {
      const marker = new google.maps.Marker({
        position: { lat: p.lat, lng: p.lng },
        map: state.map,
        label: {
          text: String(i + 1),
          color: '#fff',
          fontSize: '12px',
          fontWeight: '600',
        },
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 14,
          fillColor: '#1f4b8e',
          fillOpacity: 1,
          strokeColor: '#fff',
          strokeWeight: 2,
        },
        title: p.name,
      });
      const info = new google.maps.InfoWindow({
        content: `<div class="iw-content">
          <div class="iw-name">${escapeHtml(p.name || '')}</div>
          <div class="iw-time">${p.arriveTime || ''}${p.departTime ? ' – ' + p.departTime : ''}</div>
          ${p.memo && p.memo.trim() ? `<div class="iw-memo">${escapeHtml(p.memo.trim())}</div>` : ''}
          <div class="iw-actions">
            <a href="${p.placeId
              ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.name || '', p.address || ''].filter(Boolean).join(' ').trim() || `${p.lat},${p.lng}`)}&query_place_id=${encodeURIComponent(p.placeId)}`
              : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.name || '', p.address || ''].filter(Boolean).join(' ').trim() || `${p.lat},${p.lng}`)}`}" target="_blank" rel="noopener">📍 구글 맵에서 보기</a>
          </div>
        </div>`
      });
      marker.__pid = p.id; marker.__info = info;
      marker.addListener('click', () => focusPlaceOnMap(p, true));
      state.markers.push(marker);
    });

    // Polyline으로 연결 (각 구간마다 모드별 색)
    for (let i = 0; i < dayPs.length - 1; i++) {
      const a = dayPs[i], b = dayPs[i + 1];
      const mode = a.transitMode || 'WALK';
      const line = new google.maps.Polyline({
        path: [{lat: a.lat, lng: a.lng}, {lat: b.lat, lng: b.lng}],
        strokeColor: MAP_COLORS[mode] || '#1f4b8e',
        strokeOpacity: 0,
        icons: [{
          icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 },
          offset: '0', repeat: '10px'
        }],
        map: state.map,
      });
      state.polylines.push(line);
    }
  });

  fitMapBounds(false);
  highlightFocus();

  // Legend
  const totalDist = placesWithCoord.reduce((s, p, i) => {
    if (i === 0) return 0;
    const prev = placesWithCoord[i-1];
    return s + haversine({lat:prev.lat,lng:prev.lng}, {lat:p.lat,lng:p.lng});
  }, 0);
  const label = state.currentDay <= 0
    ? `전체 · ${placesWithCoord.length}곳 · ${fmtDistance(totalDist)}`
    : `Day ${state.currentDay} · ${placesWithCoord.length}곳 · ${fmtDistance(totalDist)}`;
  showLegend(label);
};

const fitMapBounds = (animated) => {
  const toShow = state.currentDay <= 0 ? state.places : state.places.filter(p => p.day === state.currentDay);
  const pts = toShow.filter(p => p.lat && p.lng);
  if (!pts.length || !state.map) return;
  if (pts.length === 1) {
    state.map.setCenter({ lat: pts[0].lat, lng: pts[0].lng });
    state.map.setZoom(15);
    return;
  }
  const b = new google.maps.LatLngBounds();
  pts.forEach(p => b.extend({ lat: p.lat, lng: p.lng }));
  state.map.fitBounds(b, 60);
};

const showLegend = (text) => {
  [$('#map-legend'), $('#map-legend-m')].forEach(l => {
    if (!l) return;
    if (text) { l.textContent = text; l.hidden = false; }
    else l.hidden = true;
  });
};

const showMyLocation = () => {
  if (!navigator.geolocation) { toast('위치 서비스를 쓸 수 없습니다'); return; }
  toast('위치 가져오는 중...');
  navigator.geolocation.getCurrentPosition((pos) => {
    const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    if (state.myLocationMarker) state.myLocationMarker.setMap(null);
    state.myLocationMarker = new google.maps.Marker({
      position: latlng,
      map: state.map,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 8,
        fillColor: '#4285F4',
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 3,
      },
      title: '내 위치',
      zIndex: 1000,
    });
    state.map.panTo(latlng);
    state.map.setZoom(Math.max(state.map.getZoom(), 14));
    toast('현재 위치를 지도에 표시했습니다');
  }, (err) => {
    toast('위치를 가져올 수 없습니다: ' + err.message);
  });
};

const escapeHtml = (s) => (s||'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

// ───────────────────────────────────────
// 모달 공통
// ───────────────────────────────────────
// 팝업이 열려 있는 동안 뒤로가기(휴대폰 제스처 포함)는 페이지를 떠나지 않고 팝업만 닫는다.
const openModal = (id) => {
  const m = $('#' + id);
  if (m.classList.contains('show')) return;
  m.classList.add('show');
  try { history.pushState({ tnModal: id }, '', location.href); } catch (e) {}
};
const closeModal = (id) => {
  const m = $('#' + id);
  if (!m.classList.contains('show')) return;
  m.classList.remove('show');
  // 팝업을 버튼으로 닫은 경우, 열 때 쌓은 기록 한 칸을 되돌려 정리
  if (history.state && history.state.tnModal === id) { try { history.back(); } catch (e) {} }
};
window.addEventListener('popstate', () => {
  $$('.modal-scrim.show').forEach(m => m.classList.remove('show'));
});
document.addEventListener('click', (e) => {
  const close = e.target.dataset?.close;
  if (close) closeModal(close);
  // scrim 클릭하면 닫기 (modal 자체 클릭은 제외)
  if (e.target.classList.contains('modal-scrim')) {
    closeModal(e.target.id);
  }
});

// ───────────────────────────────────────
// 여행 모달
// ───────────────────────────────────────
const openTripModal = (trip) => {
  $('#modal-trip-title').textContent = trip ? '여행 수정' : '새 여행';
  $('#trip-name-input').value = trip?.title || '';
  $('#trip-start-input').value = trip?.startDate || '';
  $('#trip-end-input').value = trip?.endDate || '';
  $('#btn-delete-trip').style.display = trip ? '' : 'none';
  $('#btn-save-trip').dataset.id = trip?.id || '';
  openModal('modal-trip');
};
$('#btn-new-trip').onclick = () => openTripModal(null);
$('#btn-save-trip').onclick = async () => {
  const title = $('#trip-name-input').value.trim();
  const startDate = $('#trip-start-input').value;
  const endDate = $('#trip-end-input').value;
  if (!title) { toast('여행 이름을 입력하세요'); return; }
  if (!startDate || !endDate) { toast('출발일과 도착일을 입력하세요'); return; }
  if (startDate > endDate) { toast('출발일이 도착일보다 늦을 수 없습니다'); return; }
  const id = $('#btn-save-trip').dataset.id;
  try {
    const savedId = await saveTrip({ id: id || undefined, title, startDate, endDate });
    closeModal('modal-trip');
    toast(id ? '여행이 수정되었습니다' : '새 여행이 저장되었습니다');
    if (!id) selectTrip(savedId);
  } catch (err) {
    console.error(err);
    toast('저장 실패: ' + err.message);
  }
};
$('#btn-delete-trip').onclick = async () => {
  const id = $('#btn-save-trip').dataset.id;
  if (!id) return;
  if (!confirm('이 여행과 모든 장소를 삭제하시겠습니까?')) return;
  try {
    await deleteTrip(id);
    closeModal('modal-trip');
    toast('여행이 삭제되었습니다');
    if (state.currentTripId === id) {
      state.currentTripId = null;
      state.currentTrip = null;
      renderCurrentTrip();
      subscribePlaces(null);
      updateUrl();
    }
  } catch (err) {
    console.error(err); toast('삭제 실패: ' + err.message);
  }
};

const openPlaceModal = (place) => {
  if (!state.currentTripId) { toast('여행을 먼저 선택하세요'); return; }
  // onclick으로 호출될 때 Event 객체가 들어오는 경우 null로 처리 (버그 방지)
  if (place && (place instanceof Event || !place.id)) place = null;
  state.editingPlaceId = place?.id || null;
  const day = state.currentDay > 0 ? state.currentDay : 1;
  $('#modal-place-title').textContent = place ? '장소 수정' : `장소 추가 · Day ${day}`;

  $('#place-search-input').value = place?.name || '';
  $('#place-arrive-input').value = place?.arriveTime || '';
  $('#place-depart-input').value = place?.departTime || '';
  $('#place-cost-input').value = place?.cost || '';
  $('#place-memo-input').value = place?.memo || '';
  state.selectedMode = place?.transitMode || 'WALK';
  updateModePicker();

  if (place) {
    state.selectedPlace = {
      name: place.name, address: place.address, lat: place.lat, lng: place.lng,
      placeId: place.placeId, hours: place.hours,
    };
    showSelectedPlace(state.selectedPlace);
  } else {
    state.selectedPlace = null;
    $('#selected-place').hidden = true;
  }
  $('#btn-delete-place').style.display = place ? '' : 'none';

};

// 24시간 시간 입력 자동 포맷 (텍스트 input)
// - 숫자만 받고, 3글자 이상이면 자동으로 ":" 삽입
// - blur 시 유효성 검증 (HH:MM, HH ≤ 23, MM ≤ 59)
let timeInputsBound = false;
const setupTimeInputs = () => {
  if (timeInputsBound) return;
  timeInputsBound = true;
  $$('.time-input').forEach(input => {
    input.addEventListener('input', (e) => {
      let v = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
      if (v.length >= 3) v = v.slice(0, 2) + ':' + v.slice(2);
      e.target.value = v;
    });
    input.addEventListener('blur', (e) => {
      const v = e.target.value.trim();
      if (!v) return;  // 빈 값 OK (선택 입력)
      // "8" → "08:00", "830" → "08:30" 같은 보정 시도
      let cleaned = v.replace(/[^0-9]/g, '');
      if (cleaned.length === 1) cleaned = '0' + cleaned + '00';
      else if (cleaned.length === 2) cleaned = cleaned + '00';
      else if (cleaned.length === 3) cleaned = '0' + cleaned;
      const hh = parseInt(cleaned.slice(0, 2));
      const mm = parseInt(cleaned.slice(2, 4));
      if (isNaN(hh) || isNaN(mm) || hh > 23 || mm > 59) {
        toast('유효하지 않은 시간입니다 (00:00 ~ 23:59)');
        e.target.value = '';
        return;
      }
      e.target.value = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    });
  });
};

const showSelectedPlace = (sp) => {
  if (!sp) { $('#selected-place').hidden = true; return; }
  $('#sp-name-input').value = sp.name || '';
  $('#sp-addr').textContent = sp.address || '';
  $('#sp-coord').textContent = sp.lat && sp.lng ? `${sp.lat.toFixed(5)}, ${sp.lng.toFixed(5)}` : '';
  $('#selected-place').hidden = false;
};

// Google Places Autocomplete (New Places API via REST)
// Legacy google.maps.places.Autocomplete는 "Places API (New)"만 활성화된 프로젝트에서는 작동하지 않음.
// 따라서 fetch로 Places API (New) 엔드포인트를 직접 호출.
let acDebounceTimer = null;
let acSessionToken = null;

const genSessionToken = () => {
  // UUID v4 간이 생성 (세션 단위 과금을 위한 토큰)
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
};

const setupAutocomplete = () => {
  const input = $('#place-search-input');
  const wrap = input.closest('.autocomplete-wrap');
  // 기존 결과 리스트 제거
  wrap.querySelector('.autocomplete-results')?.remove();
  const resultsEl = el('div', { class: 'autocomplete-results', hidden: '' });
  wrap.appendChild(resultsEl);
  // 세션 시작
  acSessionToken = genSessionToken();

  // 디바운스된 자동완성 호출
  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearTimeout(acDebounceTimer);
    if (q.length < 1) {
      resultsEl.hidden = true;
      return;
    }
    acDebounceTimer = setTimeout(() => fetchAutocomplete(q, resultsEl), 300);
  });

  // 바깥 클릭 시 숨기기
  document.addEventListener('click', (e) => {
    if (!wrap.contains(e.target)) resultsEl.hidden = true;
  }, { once: false });
};

const fetchAutocomplete = async (query, resultsEl) => {
  try {
    // 지도 중심 기준 location bias (더 정확한 결과)
    const bias = {};
    if (state.map) {
      const c = state.map.getCenter();
      bias.locationBias = {
        circle: {
          center: { latitude: c.lat(), longitude: c.lng() },
          radius: 50000.0,
        }
      };
    }
    const body = {
      input: query,
      languageCode: 'ko',
      sessionToken: acSessionToken,
      ...bias,
    };
    const res = await fetch('https://places.googleapis.com/v1/places:autocomplete', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': MAPS_API_KEY,
      },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const errText = await res.text();
      console.error('Autocomplete API error', res.status, errText);
      resultsEl.innerHTML = `<div class="autocomplete-item" style="color:var(--danger)">검색 실패 (${res.status})</div>`;
      resultsEl.hidden = false;
      return;
    }
    const data = await res.json();
    const suggestions = data.suggestions || [];
    renderAutocompleteResults(suggestions, resultsEl);
  } catch (e) {
    console.error('fetchAutocomplete error', e);
    resultsEl.innerHTML = `<div class="autocomplete-item" style="color:var(--danger)">네트워크 오류</div>`;
    resultsEl.hidden = false;
  }
};

const renderAutocompleteResults = (suggestions, resultsEl) => {
  resultsEl.innerHTML = '';
  if (!suggestions.length) {
    resultsEl.innerHTML = `<div class="autocomplete-item" style="color:var(--ink-faint)">결과 없음 — 이름만으로 저장 가능 (좌표 없이)</div>`;
    resultsEl.hidden = false;
    return;
  }
  suggestions.forEach(s => {
    const p = s.placePrediction;
    if (!p) return;
    const name = p.structuredFormat?.mainText?.text || p.text?.text || '';
    const addr = p.structuredFormat?.secondaryText?.text || '';
    const item = el('div', {
      class: 'autocomplete-item',
      onclick: () => selectAutocompleteItem(p),
    }, [
      el('div', { class: 'ac-name' }, name),
      addr ? el('div', { class: 'ac-addr' }, addr) : null,
    ].filter(Boolean));
    resultsEl.appendChild(item);
  });
  resultsEl.hidden = false;
};

const selectAutocompleteItem = async (prediction) => {
  const resultsEl = $('.autocomplete-results');
  if (resultsEl) resultsEl.hidden = true;
  // 상세 정보 조회
  try {
    const url = `https://places.googleapis.com/v1/places/${prediction.placeId}?sessionToken=${acSessionToken}`;
    const res = await fetch(url, {
      headers: {
        'X-Goog-Api-Key': MAPS_API_KEY,
        'X-Goog-FieldMask': 'id,displayName,formattedAddress,location,regularOpeningHours',
      },
    });
    if (!res.ok) {
      console.error('place details failed', res.status);
      toast('장소 상세 정보를 가져오지 못했습니다');
      return;
    }
    const p = await res.json();
    const todayIdx = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
    const hoursToday = p.regularOpeningHours?.weekdayDescriptions?.[todayIdx] || null;
    state.selectedPlace = {
      name: p.displayName?.text || prediction.structuredFormat?.mainText?.text || '',
      address: p.formattedAddress || '',
      lat: p.location?.latitude,
      lng: p.location?.longitude,
      placeId: p.id,
      hours: hoursToday,
    };
    $('#place-search-input').value = state.selectedPlace.name;
    showSelectedPlace(state.selectedPlace);
    // 세션 종료 → 새 세션 시작
    acSessionToken = genSessionToken();
  } catch (e) {
    console.error('select autocomplete error', e);
    toast('장소 선택 중 오류 발생');
  }
};

// 교통수단 선택

$('#btn-save-place').onclick = async () => {
  // 자동완성 선택 없이도 저장 가능하도록 fallback: input의 텍스트를 그대로 이름으로 사용
  const typedName = $('#place-search-input').value.trim();
  if (!state.selectedPlace && !typedName) {
    toast('장소 이름을 입력하거나 검색해서 선택하세요');
    return;
  }
  const sp = state.selectedPlace || {};
  const customName = $('#sp-name-input').value.trim();
  const a = $('#place-arrive-input').value, d = $('#place-depart-input').value;
  if (a && d && d < a) {
    toast('출발 시간이 도착 시간보다 빠릅니다. 확인해 주세요');
    return;
  }
  const data = {
    day: state.currentDay > 0 ? state.currentDay : 1,
    name: (state.selectedPlace ? customName : '') || sp.name || typedName,
    address: sp.address || '',
    lat: sp.lat ?? null,
    lng: sp.lng ?? null,
    placeId: sp.placeId || '',
    hours: sp.hours || '',
    arriveTime: $('#place-arrive-input').value || '',
    departTime: $('#place-depart-input').value || '',
    memo: $('#place-memo-input').value || '',
    transitMode: state.selectedMode,
    cost: Number($('#place-cost-input').value) || 0,
  };
  // 새 장소의 orderNo = 그 Day의 마지막 + 1
  if (!state.editingPlaceId) {
    const siblings = state.places.filter(p => p.day === data.day);
    data.orderNo = siblings.length + 1;
  }
  try {
    await savePlace(state.currentTripId, {
      id: state.editingPlaceId || undefined,
      ...data,
    });
    closeModal('modal-place');
    toast(state.editingPlaceId ? '장소가 수정되었습니다' : '장소가 추가되었습니다');
  } catch (err) {
    console.error(err); toast('저장 실패: ' + err.message);
  }
};
$('#btn-delete-place').onclick = async () => {
  if (!state.editingPlaceId) return;
  if (!confirm('이 장소를 삭제하시겠습니까?')) return;
  try {
    await deletePlace(state.currentTripId, state.editingPlaceId);
    closeModal('modal-place');
    toast('장소가 삭제되었습니다');
  } catch (err) {

};

// Navigation / URL
// ───────────────────────────────────────
const selectTrip = (id) => {
  state.currentTripId = id;
  state.currentTrip = state.trips.find(t => t.id === id) || null;
  state.currentDay = 1;
  state.weatherFetchedFor = null; // 여행 변경 시 날씨 재조회
  renderTripsList();
  renderCurrentTrip();
  subscribePlaces(id);
  updateUrl();
  closeMobileSidebar();
};

const updateUrl = () => {
  const params = new URLSearchParams();
  if (state.currentTripId) params.set('trip', state.currentTripId);
  if (state.currentDay && state.currentDay !== 1) params.set('day', state.currentDay);
  const q = params.toString();
  history.replaceState(history.state, '', q ? '?' + q : location.pathname);
};
const readUrl = () => {
  const p = new URLSearchParams(location.search);
  const trip = p.get('trip');
  const day = parseInt(p.get('day') || '1');
  if (trip) {
    state.currentDay = day;
    // trip이 로드된 뒤에 selectTrip 호출됨 (아래 subscribeTrips에서)
    state.pendingTrip = trip;
  }
};


// 지도 영역 크기 조절 (PC) — 왼쪽 경계를 드래그, 더블클릭하면 기본 크기
(() => {
  const handle = document.getElementById('aside-resizer');
  if (!handle) return;
  const root = document.documentElement;
  const MIN = 280, DEFAULT = 400;
  const maxW = () => Math.max(MIN, window.innerWidth - 280 - 320);
  const clamp = (w) => Math.min(maxW(), Math.max(MIN, w));
  const apply = (w) => root.style.setProperty('--aside-w', clamp(w) + 'px');
  const refreshMap = () => { if (state.map && window.google) google.maps.event.trigger(state.map, 'resize'); };
  try { const saved = parseInt(localStorage.getItem('tripnote.asideW')); if (saved) apply(saved); } catch (e) {}
  let dragging = false;
  handle.addEventListener('pointerdown', (e) => {
    dragging = true; handle.setPointerCapture(e.pointerId);
    handle.classList.add('dragging'); document.body.classList.add('resizing');
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    apply(window.innerWidth - e.clientX);
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; handle.classList.remove('dragging'); document.body.classList.remove('resizing');
    try { localStorage.setItem('tripnote.asideW', parseInt(getComputedStyle(root).getPropertyValue('--aside-w'))); } catch (e) {}
    refreshMap();
  };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
  handle.addEventListener('dblclick', () => {
    apply(DEFAULT);
    try { localStorage.removeItem('tripnote.asideW'); } catch (e) {}
    refreshMap();
  });
  window.addEventListener('resize', () => { const w = parseInt(getComputedStyle(root).getPropertyValue('--aside-w')); if (w) apply(w); refreshMap(); });
})();

// 지도 높이 조절 (모바일) — 지도와 목록 사이 바를 위아래로 드래그, 더블탭하면 기본/크게 전환
(() => {
  const bar = document.getElementById('map-vresizer');
  const wrap = document.getElementById('map-mobile-wrap');
  const mid = document.getElementById('middle-content');
  if (!bar || !wrap || !mid) return;
  const root = document.documentElement;
  const MIN = 120;
  const maxH = () => Math.max(MIN, mid.clientHeight - 22 - 160);
  const apply = (h) => root.style.setProperty('--map-h', Math.min(maxH(), Math.max(MIN, h)) + 'px');
  const refresh = () => { if (state.map && window.google) google.maps.event.trigger(state.map, 'resize'); };
  try { const v = parseInt(localStorage.getItem('tripnote.mapH')); if (v) apply(v); } catch (e) {}
  let dragging = false, lastTap = 0;
  bar.addEventListener('pointerdown', (e) => {
    dragging = true; bar.setPointerCapture(e.pointerId);
    bar.classList.add('dragging'); document.body.classList.add('resizing-v');
    const now = Date.now();
    if (now - lastTap < 350) {
      dragging = false; bar.classList.remove('dragging'); document.body.classList.remove('resizing-v');
      const cur = wrap.getBoundingClientRect().height;
      const big = maxH() * 0.9;
      apply(cur > big * 0.85 ? mid.clientHeight * 0.42 : big);
      try { localStorage.setItem('tripnote.mapH', parseInt(wrap.getBoundingClientRect().height)); } catch (er) {}
      setTimeout(refresh, 50);
    }
    lastTap = now;
  });
  bar.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    apply(e.clientY - wrap.getBoundingClientRect().top);
    refresh();
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; bar.classList.remove('dragging'); document.body.classList.remove('resizing-v');
    try { localStorage.setItem('tripnote.mapH', parseInt(wrap.getBoundingClientRect().height)); } catch (e) {}
    refresh();
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
  window.addEventListener('resize', () => { const h = parseInt(getComputedStyle(root).getPropertyValue('--map-h')); if (h) apply(h); });
})();

// Error display
// ───────────────────────────────────────
const showError = (msg) => {
  if ($('.error-banner')) return;
  const b = el('div', { class: 'error-banner' }, msg);
  document.body.insertBefore(b, document.body.firstChild);
  setTimeout(() => b.remove(), 8000);
};

// ───────────────────────────────────────
// 부팅
// ───────────────────────────────────────
(async () => {
  readUrl();
  renderCurrentTrip();  // 초기 empty state
  try {
    await loadMaps();
    ensureMap();
  } catch (e) {
    console.error('Google Maps load error', e);
    showError('지도를 불러오지 못했습니다. API 키나 네트워크를 확인하세요.');
  }
  subscribeTrips();

  // trip이 로드되면 pendingTrip 적용
  const checkPending = setInterval(() => {
    if (state.pendingTrip && state.trips.find(t => t.id === state.pendingTrip)) {
      selectTrip(state.pendingTrip);
      state.pendingTrip = null;
      clearInterval(checkPending);
    } else if (state.trips.length && !state.pendingTrip) {
      clearInterval(checkPending);
    }
  }, 300);
})();

// 리사이즈 시 모바일 ↔ 데스크톱 지도 전환
let lastIsMobile = window.matchMedia('(max-width: 1024px)').matches;
window.addEventListener('resize', () => {
  const isMobile = window.matchMedia('(max-width: 1024px)').matches;
  if (isMobile !== lastIsMobile) {
    lastIsMobile = isMobile;
    state.map = null;
    ensureMap();
    renderMap();
  }
});

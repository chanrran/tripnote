const fbApp = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(fbApp);
const logEl = document.getElementById('log');
const btn = document.getElementById('btn');

function log(msg, cls='info') {
  const d = document.createElement('div');
  d.className = 'status ' + cls;
  d.textContent = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

window.run = async function() {
  btn.disabled = true;
  btn.textContent = '처리 중...';

  try {
    // 1) 기존 D4, D5 장소 삭제
    log('기존 D4·D5 장소 확인 중...');
    const placesRef = collection(db, 'trips', TRIP_ID, 'places');
    const snap = await getDocs(placesRef);
    let delCount = 0;
    const batch1 = writeBatch(db);
    snap.forEach(d => {
      const data = d.data();
      if (data.day === 4 || data.day === 5) {
        batch1.delete(doc(db, 'trips', TRIP_ID, 'places', d.id));
        delCount++;
      }
    });
    if (delCount > 0) {
      await batch1.commit();
      log(`기존 D4·D5 장소 ${delCount}개 삭제 완료`, 'ok');
    } else {
      log('기존 D4·D5 장소 없음 — 바로 추가합니다', 'ok');
    }

    // 2) 새 장소 추가
    log('새 장소 14개 추가 중...');
    const batch2 = writeBatch(db);
    PLACES.forEach((p, i) => {
      const id = 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6) + i;
      const ref = doc(db, 'trips', TRIP_ID, 'places', id);
      batch2.set(ref, { ...p, createdAt: serverTimestamp() });
    });
    await batch2.commit();
    log('✅ D4·D5 장소 14개 추가 완료!', 'ok');

    // 검증: 방금 저장한 데이터 다시 읽어서 lat/lng 타입 확인
    log('📍 좌표 검증 중...');
    const verifySnap = await getDocs(collection(db, 'trips', TRIP_ID, 'places'));
    let totalD45 = 0;
    let coordOk = 0;
    let coordBad = 0;
    let details = [];
    verifySnap.forEach(d => {
      const data = d.data();
      if (data.day === 4 || data.day === 5) {
        totalD45++;
        const latOk = typeof data.lat === 'number' && data.lat > 30;
        const lngOk = typeof data.lng === 'number' && data.lng > 130;
        if (latOk && lngOk) {
          coordOk++;
        } else {
          coordBad++;
          details.push(`⚠️ ${data.name}: lat=${JSON.stringify(data.lat)} (${typeof data.lat}), lng=${JSON.stringify(data.lng)} (${typeof data.lng})`);
        }
      }
    });

    if (coordBad > 0) {
      details.forEach(d => log(d, 'warn'));
      log(`❌ 좌표 문제 ${coordBad}개 발견! 지도 핀이 안 보일 수 있습니다.`, 'err');
    } else {
      log(`✅ 전체 ${totalD45}개 장소 좌표 정상 확인! (lat: number, lng: number)`, 'ok');
    }

    log('🔄 트립노트 앱으로 돌아가서 새로고침 해주세요!', 'ok');
    log('(페이지를 아래로 당기거나, D4/D5 탭을 다시 눌러주세요)', 'ok');

    btn.textContent = '✅ 완료';
  } catch(e) {
    log('❌ 오류: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '다시 시도';
  }
};
